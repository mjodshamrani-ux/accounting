name: Test and deploy Tarasuf Pages
'on':
  push:
    branches:
      - main
      - master
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Verify approved public source and privacy guard
        run: |
          node --test scripts/public-content-check.test.mjs
          node scripts/public-content-check.mjs --source
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Verify Claude Code skills, rules, hook settings and their references
        run: pnpm test:claude-skills
      - name: Verify integrated family CI syntax and required gate wiring offline
        run: pnpm test:source-families:ci
      - run: pnpm test
        env:
          RUNNING_SESSION_REPORT_DIR: ${{ runner.temp }}/running-balance-session
      - run: pnpm test:mutation-runner
      - name: Verify GL-TB request source and session binding with independent exports and guard faults
        env:
          GL_TB_BINDING_REPORT_DIR: ${{ runner.temp }}/gl-tb-binding-exports
          GL_TB_BINDING_MUTATION_DIR: ${{ runner.temp }}/gl-tb-binding-mutations
        run: |
          node --experimental-strip-types --test --test-reporter=tap tests/gl-tb-binding.test.ts
          python3 -B audit/gl-tb-binding/check_exports.py "$GL_TB_BINDING_REPORT_DIR"
          node scripts/test-gl-tb-binding-mutations.mjs
      - name: Independently verify bank movements, gross/net roles, complete reversals and retained timing
        run: |
          node --experimental-strip-types audit/bank/export-fixture.mjs
          python3 -m unittest discover -s audit/bank -p 'test_*.py' -v
      - name: Verify synthetic FIN hierarchy acceptance foundation without activating product support
        run: python3 -B -m unittest discover -s audit/tb-financial-hierarchy -p 'test_*.py' -v
      - name: Independently verify payment allocation capacity, remittance, history and replay
        run: |
          node --experimental-strip-types audit/allocation/export-fixture.mjs
          python3 -m unittest discover -s audit/allocation -p 'test_*.py' -v
      - name: Independently verify GL detail and balance-source cells, bridges and replay
        run: |
          node --experimental-strip-types audit/gl-tb/export-fixture.mjs
          python3 -m unittest discover -s audit/gl-tb -p 'test_*.py' -v
      - name: Independently verify customer AR original documents, decisions and replay workpapers
        run: |
          node --experimental-strip-types audit/ar-limited/export-fixture.mjs
          python3 -m unittest discover -s audit/ar-limited -p 'test_*.py' -v
      - name: Independently verify native single-account clearing and replay workpapers
        run: |
          node --experimental-strip-types audit/clearing/export-fixture.mjs
          python3 audit/clearing/check_export.py work/clearing/direct.xlsx work/clearing/restored.xlsx
          python3 -m unittest discover -s audit/clearing -p 'test_*.py' -v
      - name: Verify recorded real local-provider experiment without downloading model weights
        run: python3 -m unittest discover -s audit/local-provider -p 'test_*.py' -v
      - name: Independently verify source pixels and cell review receipts
        run: python3 -m unittest discover -s audit/visual-cell-review -p 'test_*.py' -v
      - name: Preserve failed numeric OCR evidence and verify manual crop receipts independently
        run: python3 -m unittest discover -s audit/visual-numeric -p 'test_*.py' -v
      - name: Independently verify table inventory and detect missing or misassigned source facts
        run: python3 -m unittest discover -s audit/visual-table -p 'test_*.py' -v
      - name: Independently verify explicit reviewed-image sources and partial Excel results
        run: |
          python3 -m unittest discover -s audit/visual-accounting -p 'test_*.py' -v
          node --experimental-strip-types audit/visual-accounting/make_record.mjs
          node --experimental-strip-types audit/visual-accounting/export_fixture.mjs
          python3 audit/visual-accounting/check_record.py work/visual-accounting/statement.tarasuf-reviewed.json audit/visual-table/fixtures/statement.png
          python3 audit/visual-accounting/check_export.py work/visual-accounting/direct.xlsx work/visual-accounting/restored.xlsx
      - name: Independently verify bilingual reviewed debit-credit sources and partial workpapers
        run: |
          python3 -m unittest discover -s audit/visual-split -p 'test_*.py' -v
          node --experimental-strip-types audit/visual-split/export-fixture.mjs
          python3 audit/visual-split/check_export.py work/visual-split/en-direct.xlsx work/visual-split/en-restored.xlsx work/visual-split/ar-direct.xlsx work/visual-split/ar-restored.xlsx
      - name: Detect false matches and changed workbook evidence
        run: python3 -m unittest discover -s audit/export-design -p 'test_*.py' -v
      - name: Verify frozen layered-statement source facts and independent export oracle
        run: |
          python3 audit/layered-statement/check_contract.py
          python3 audit/astra-cycle4/check_r13.py work/layered-headers/r13-fixed-workpaper.xlsx --expected-engine 0.3.26-experimental
          python3 -m unittest discover -s audit/astra-cycle4 -p 'test_*.py' -v
          python3 -m unittest discover -s audit/layered-statement -p 'test_*.py' -v
      - name: Verify own-document roles and independent related-invoice Excel evidence
        run: |
          REQUIRE_F03_PASS=1 node --experimental-strip-types audit/related-invoice/run.mjs . work/f03-native
          REQUIRE_F03_PASS=1 node --experimental-strip-types audit/related-invoice/run.mjs . work/f03-pdf pdf
          python3 audit/related-invoice/check_export.py work/f03-native/*.xlsx work/f03-pdf/*.xlsx
          python3 -m unittest discover -s audit/related-invoice -p 'test_*.py' -v
      - name: Verify unknown credit-number roles without blocking blank template columns
        run: |
          REQUIRE_UNKNOWN_PASS=1 node --experimental-strip-types audit/related-invoice/unknown-role/run.mjs . work/unknown-role
          python3 audit/related-invoice/unknown-role/check_export.py work/unknown-role/*.xlsx
          python3 -m unittest discover -s audit/related-invoice/unknown-role -p 'test_*.py' -v
      - name: Verify canonical explanation evidence and native replay independently
        run: |
          REQUIRE_P5_PASS=1 node --experimental-strip-types audit/assistant-evidence/run.mjs . work/p5-native
          python3 audit/assistant-evidence/check_export.py work/p5-native/*.xlsx --answers work/p5-native/observations.json
          python3 -m unittest discover -s audit/assistant-evidence -p 'test_*.py' -v
      - name: Preserve proved groups and reject competing identity memberships
        run: pnpm test:reliability:p2
      - name: Preserve useful partial results and independently check unresolved errors in Excel
        run: pnpm test:reliability:partial
      - name: Verify independent end-to-end foundation cases
        run: pnpm test:reliability:quick
      - name: Living hard-case measurement with versioned contracts and triage (EVAL-1)
        run: pnpm test:hard-cases
      - name: Independently verify bilingual Excel outputs
        run: |
          node --experimental-strip-types audit/stress/export-corpus.mjs
          python3 audit/stress/check_openxml.py
      - name: Verify running-balance native inputs, authority, limits, literal exports and semantic mutations
        env:
          RUNNING_SESSION_REPORT_DIR: ${{ runner.temp }}/running-balance-session
          RUNNING_REPORT_DIR: ${{ runner.temp }}/running-balance-proof
          RUNNING_MUTATION_REPORT_DIR: ${{ runner.temp }}/running-balance-mutations
        run: |
          pnpm test:running-balance
          pnpm test:running-balance:proof
          pnpm test:running-balance:mutations
      - name: Verify vertical TB originals, six-cell evidence, native replay and semantic mutations
        env:
          GL_TB_VERTICAL_REPORT_DIR: ${{ runner.temp }}/gl-tb-vertical-proof
          GL_TB_VERTICAL_MUTATION_REPORT_DIR: ${{ runner.temp }}/gl-tb-vertical-mutations
        run: |
          pnpm test:gl-tb-vertical
          pnpm test:gl-tb-vertical:proof
          pnpm test:gl-tb-vertical:mutations
      - name: Verify withdrawal-deposit original sources, six-source lifecycle and assertion mutations
        env:
          BANK_WD_PROOF_DIR: ${{ runner.temp }}/bank-wd-proof
          BANK_WD_MUTATION_DIR: ${{ runner.temp }}/bank-wd-mutations
        run: |
          pnpm test:bank-wd:mutations
          node --experimental-strip-types audit/bank-withdrawal-deposit/prove.mjs
          node --experimental-strip-types audit/bank-withdrawal-deposit/lifecycle-proof.mjs "${{ runner.temp }}/bank-wd-lifecycle"
          python3 -B audit/bank-withdrawal-deposit/check-evidence.py "$BANK_WD_PROOF_DIR"/attempt-* "${{ runner.temp }}/bank-wd-lifecycle" --output "${{ runner.temp }}/bank-wd-evidence-check.json"
      - name: Verify supplied long asset components, original lifecycle, oracle and mutations
        env:
          ASSET_LONG_REPORT_DIR: ${{ runner.temp }}/fixed-assets-long-proof
          ASSET_LONG_ORACLE_REPORT_DIR: ${{ runner.temp }}/fixed-assets-long-oracle
          ASSET_LONG_MUTATION_DIR: ${{ runner.temp }}/fixed-assets-long-mutations
        run: |
          pnpm test:fixed-assets-long
          pnpm test:fixed-assets-long:oracle
          pnpm test:fixed-assets-long:proof
          pnpm test:fixed-assets-long:mutations
      - name: Verify explicit signed-kind gateway originals, lifecycle, independent exports and mutations
        env:
          PG_SIGNED_PROOF_DIR: ${{ runner.temp }}/payment-gateway-signed-proof
          PG_SIGNED_EXPORT_CHECK_DIR: ${{ runner.temp }}/payment-gateway-signed-export-check
          PG_SIGNED_ORACLE_DIR: ${{ runner.temp }}/payment-gateway-signed-oracle
          PG_SIGNED_MUTATION_REPORT_DIR: ${{ runner.temp }}/payment-gateway-signed-mutations
        run: |
          pnpm test:payment-gateway-signed
          pnpm test:payment-gateway-signed:oracle
          pnpm test:payment-gateway-signed:proof
          pnpm test:payment-gateway-signed:mutations
      - name: Verify AR scope headers, original amounts, sessions, independent exports and semantic mutations
        env:
          AR_SCOPE_DETAILS_REPORT_DIR: ${{ runner.temp }}/ar-scope-details-proof
          AR_SCOPE_CHECK_DIR: ${{ runner.temp }}/ar-scope-details-check
          AR_SCOPE_MUTATION_DIR: ${{ runner.temp }}/ar-scope-details-mutations
        run: |
          pnpm test:ar-scope-details
          pnpm test:ar-scope-details:oracle
          pnpm test:ar-scope-details:proof
          pnpm test:ar-scope-details:mutations
      - name: Verify sectioned inventory originals, literal citations, financial links and worker binding
        env:
          INV_SECTION_PROOF_DIR: ${{ runner.temp }}/inventory-section-proof
          INV_SECTION_MUTATION_DIR: ${{ runner.temp }}/inventory-section-mutations
        run: |
          pnpm test:inventory-sections
          pnpm test:inventory-sections:oracle
          pnpm test:inventory-sections:proof
          pnpm test:inventory-sections:mutations
      - name: Verify inventory matrix originals, quantities, dimensions, column ownership and worker binding
        env:
          INV_MATRIX_PROOF_DIR: ${{ runner.temp }}/inventory-matrix-proof
          INV_MATRIX_MUTATION_DIR: ${{ runner.temp }}/inventory-matrix-mutations
        run: |
          pnpm test:inventory-matrix
          pnpm test:inventory-matrix:oracle
          pnpm test:inventory-matrix:proof
          pnpm test:inventory-matrix:mutations
      - name: Verify hierarchy inventory originals, parent ownership, merge payload and independent outputs
        env:
          INV_HIERARCHY_PROOF_DIR: ${{ runner.temp }}/inventory-hierarchy-proof
          INV_HIERARCHY_MUTATION_DIR: ${{ runner.temp }}/inventory-hierarchy-mutations
        run: |
          pnpm test:inventory-hierarchy
          pnpm test:inventory-hierarchy:oracle
          pnpm test:inventory-hierarchy:proof
          pnpm test:inventory-hierarchy:mutations
      - name: Verify column-header source truth and preserve pre-implementation product refusals
        env:
          INV_COLUMN_BASELINE_DIR: ${{ runner.temp }}/inventory-column-baseline
        run: |
          pnpm test:inventory-column:oracle
          pnpm test:inventory-column:baseline
      - name: Verify inventory PDF source truth, page boundaries and preserved pre-activation capacity gap
        env:
          INV_PDF_ACCOUNTING_PROOF_DIR: ${{ runner.temp }}/inventory-pdf-accounting
          INV_PDF_ACCOUNTING_MUTATION_DIR: ${{ runner.temp }}/inventory-pdf-accounting-mutations
          INV_PDF_FIELDS_PROOF_DIR: ${{ runner.temp }}/inventory-pdf-fields
          INV_PDF_FIELDS_MUTATION_DIR: ${{ runner.temp }}/inventory-pdf-fields-mutations
          INV_PDF_NATIVE_PROOF_DIR: ${{ runner.temp }}/inventory-pdf-native-source
          PDF_NATIVE_SOURCE_MUTATION_DIR: ${{ runner.temp }}/pdf-native-source-mutations
          INV_PDF_BASELINE_DIR: ${{ runner.temp }}/inventory-pdf-baseline
        run: |
          pnpm test:inventory-pdf:oracle
          pnpm test:inventory-pdf:baseline
          pnpm test:inventory-pdf:native-proof
          pnpm test:inventory-pdf:native-mutations
          pnpm test:inventory-pdf:fields-proof
          pnpm test:inventory-pdf:fields-mutations
          pnpm test:inventory-pdf:accounting
          pnpm test:inventory-pdf:accounting-proof
          pnpm test:inventory-pdf:accounting-mutations
      - name: Verify inventory PDF original Worker, versioned sessions, decisions and stale evidence faults
        env:
          INV_PDF_LIFECYCLE_PROOF_DIR: ${{ runner.temp }}/inventory-pdf-lifecycle
          INV_PDF_LIFECYCLE_MUTATION_DIR: ${{ runner.temp }}/inventory-pdf-lifecycle-mutations
        run: |
          pnpm test:inventory-pdf:lifecycle
          pnpm test:inventory-pdf:lifecycle-proof
          pnpm test:inventory-pdf:lifecycle-mutations
      - name: Verify inventory PDF original-bound Excel, native Worker, independent OpenXML and mutations
        env:
          INV_PDF_WORKBOOK_PROOF_DIR: ${{ runner.temp }}/inventory-pdf-workbook
          INV_PDF_WORKBOOK_MUTATION_DIR: ${{ runner.temp }}/inventory-pdf-workbook-mutations
        run: |
          pnpm test:inventory-pdf:workbook
          pnpm test:inventory-pdf:workbook-proof
          pnpm test:inventory-pdf:workbook-mutations
      - name: Verify inventory PDF workspace original preview, read-only assistant and bilingual evidence contracts
        env:
          INV_PDF_WORKSPACE_PROOF_DIR: ${{ runner.temp }}/inventory-pdf-workspace
          INV_PDF_WORKSPACE_MUTATION_DIR: ${{ runner.temp }}/inventory-pdf-workspace-mutations
        run: |
          pnpm test:inventory-pdf:workspace
          pnpm test:inventory-pdf:workspace-proof
          pnpm test:inventory-pdf:workspace-mutations
      - name: Verify bank statement source truth, independent oracle, native reading, matching and session lifecycle proofs, oracle differential, independent workbook check, code and interface-rule mutations and preserved pre-activation refusals (BNK-PDF-1)
        env:
          BNK_PDF_BASELINE_DIR: ${{ runner.temp }}/bank-statement-baseline
          BNK_G1_PROOF_DIR: ${{ runner.temp }}/bank-statement-g1
          BNK_G1_MUTATION_DIR: ${{ runner.temp }}/bank-statement-g1-mutations
          BNK_G2_PROOF_DIR: ${{ runner.temp }}/bank-statement-g2
          BNK_G2_DIFFERENTIAL_DIR: ${{ runner.temp }}/bank-statement-g2-differential
          BNK_G2_MUTATION_DIR: ${{ runner.temp }}/bank-statement-g2-mutations
          BNK_G3_PROOF_DIR: ${{ runner.temp }}/bank-statement-g3
          AR_STATEMENT_A3_DIR: ${{ runner.temp }}/ar-statement-a3
          BNK_G3_MUTATION_DIR: ${{ runner.temp }}/bank-statement-g3-mutations
          BNK_G4_MUTATION_DIR: ${{ runner.temp }}/bank-statement-g4-mutations
          BNK_G5_MUTATION_DIR: ${{ runner.temp }}/bank-statement-g5-mutations
        run: |
          pnpm test:bank-statement:oracle
          pnpm test:bank-statement:oracle-mutants
          pnpm test:bank-statement:holdout-seal
          pnpm test:supplier-statement:s3-seal
          pnpm test:ar-statement:oracle
          pnpm test:ar-statement:oracle-mutants
          pnpm test:ar-statement:seal
          pnpm test:ar-statement:baseline
          pnpm test:ar-statement:a1-proof
          pnpm test:ar-statement:a2-proof
          pnpm test:ar-statement:a3-proof
          pnpm test:bank-statement:baseline
          pnpm test:bank-statement:g1-proof
          pnpm test:bank-statement:g1-mutations
          pnpm test:bank-statement:g2-proof
          pnpm test:bank-statement:g2-differential
          pnpm test:bank-statement:g2-mutations
          pnpm test:bank-statement:g3-proof
          pnpm test:bank-statement:g3-mutations
          pnpm test:bank-statement:g4-mutations
          pnpm test:bank-statement:g5-mutations
      - name: Verify the pre-seal cashbook check, its mutants and its recorded agreement with the product's cashbook reading (BNK-PDF-1 G16)
        run: pnpm test:bank-statement:cashbook-check
      - name: Verify column hierarchy financial membership, native intervals, replay, independent exports and guard faults
        env:
          INV_COLUMN_PROOF_DIR: ${{ runner.temp }}/inventory-column-proof
          INV_COLUMN_MUTATION_DIR: ${{ runner.temp }}/inventory-column-mutations
        run: |
          pnpm test:inventory-column
          pnpm test:inventory-column:proof
          pnpm test:inventory-column:mutations
      - run: pnpm build
      - name: Verify reviewed distribution immediately after build
        run: node scripts/public-content-check.mjs --dist
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify PDF inventory built browser Worker, original sessions and reviewed financial membership
        env:
          INV_PDF_WORKER_BROWSER_DIR: ${{ runner.temp }}/inventory-pdf-worker-browser
        run: pnpm test:inventory-pdf:worker-browser
      - name: Verify inventory PDF workbooks in the exact production browser Worker
        env:
          INV_PDF_WORKBOOK_BROWSER_DIR: ${{ runner.temp }}/inventory-pdf-workbook-browser
        run: pnpm test:inventory-pdf:workbook-browser
      - name: Verify actual PDF inventory uploads, AR EN downloads, sessions, assistant, cancellation and retained work
        env:
          INV_PDF_WORKSPACE_BROWSER_DIR: ${{ runner.temp }}/inventory-pdf-workspace-ui
        run: pnpm test:inventory-pdf:workspace-browser
      - name: Verify bank statement uploads through the actual Worker, oracle-equal matches, decisions, sessions and independently checked Excel (BNK-PDF-1 G4)
        env:
          BNK_G4_BROWSER_DIR: ${{ runner.temp }}/bank-statement-workspace-browser
        run: pnpm test:bank-statement:workspace-browser
      - run: pnpm test:browser
      - name: Verify sectioned inventory CSV and Excel uploads, Arabic and English source-bound downloads
        env:
          MIZAN_CHROMIUM: /usr/bin/google-chrome
          INV_SECTION_BROWSER_DIR: ${{ runner.temp }}/inventory-section-browser
        run: pnpm test:inventory-sections:browser
      - name: Verify inventory matrix CSV and Excel uploads and independently checked bilingual downloads
        env:
          MIZAN_CHROMIUM: /usr/bin/google-chrome
          INV_MATRIX_BROWSER_DIR: ${{ runner.temp }}/inventory-matrix-browser
        run: pnpm test:inventory-matrix:browser
      - name: Verify hierarchy CSV and merged Excel uploads and independently checked bilingual outputs
        env:
          MIZAN_CHROMIUM: /usr/bin/google-chrome
          INV_HIERARCHY_BROWSER_DIR: ${{ runner.temp }}/inventory-hierarchy-browser
        run: pnpm test:inventory-hierarchy:browser
      - name: Verify column hierarchy actual Worker, bilingual source ownership and independent downloads
        env:
          INV_COLUMN_BROWSER_DIR: ${{ runner.temp }}/inventory-column-browser
        run: pnpm test:inventory-column:browser
      - name: Verify signed-kind gateway actual Worker, Arabic and English mobile downloads independently
        env:
          MIZAN_CHROMIUM: /usr/bin/google-chrome
          PG_SIGNED_BROWSER_DIR: ${{ runner.temp }}/payment-gateway-signed-browser
          PG_SIGNED_BROWSER_CHECK_DIR: ${{ runner.temp }}/payment-gateway-signed-browser-check
        run: pnpm test:payment-gateway-signed:browser
      - name: Verify AR scope details in actual Workers with Arabic and English mobile downloads
        env:
          MIZAN_CHROMIUM: /usr/bin/google-chrome
          AR_SCOPE_BROWSER_DIR: ${{ runner.temp }}/ar-scope-details-browser
          AR_SCOPE_CHECK_DIR: ${{ runner.temp }}/ar-scope-details-browser-check
        run: pnpm test:ar-scope-details:browser
      - name: Verify twelve-type entry, readiness, navigation and retained supplier state
        run: |
          pnpm test:browser:reconciliation-entry
          pnpm test:browser:startup-readiness
          pnpm test:browser:domain-navigation
          pnpm test:browser:main-integration
      - name: Verify official fonts and unified workspace sources with retained work
        run: pnpm test:browser:unified-workspace
      - name: Verify native Chrome section families and qualified currencies
        env:
          MIZAN_CHROMIUM: /usr/bin/google-chrome
          MIZAN_SECTION_PROOF_DIR: ${{ runner.temp }}/section-families-native
          MIZAN_QUALIFIED_CURRENCY_PROOF_DIR: ${{ runner.temp }}/section-currency-native
        run: |
          test -x "$MIZAN_CHROMIUM"
          pnpm test:browser:section-families
          pnpm test:browser:section-currency
      - name: Verify split-section native inputs, lifecycle, text XLSX and semantic mutations
        env:
          P4_REPORT_DIR: ${{ runner.temp }}/split-section-lifecycle
          P4_MUTATION_REPORT_DIR: ${{ runner.temp }}/split-section-mutations
        run: |
          python3 -B audit/split-section/verify_inputs.py
          python3 -B audit/split-section/check_oracle.py
          pnpm test:split-section
          python3 -B scripts/check-split-section-exports.py "$P4_REPORT_DIR"
          pnpm test:split-section:mutations
          pnpm test:native-pdf:mutations
      - name: Verify split-section review UI in native Chrome
        env:
          MIZAN_CHROMIUM: /usr/bin/google-chrome
          P4_REPORT_DIR: ${{ runner.temp }}/split-section-browser
        run: pnpm test:split-section:browser
      - name: Verify running-balance review UI and independently check Arabic and English downloads
        env:
          MIZAN_CHROMIUM: /usr/bin/google-chrome
          RUNNING_BROWSER_REPORT_DIR: ${{ runner.temp }}/running-balance-browser
        run: |
          test -x "$MIZAN_CHROMIUM"
          pnpm test:running-balance:browser
      - name: Verify vertical TB native browser lifecycle and independent bilingual workpapers
        env:
          MIZAN_CHROMIUM: /usr/bin/google-chrome
          GL_TB_VERTICAL_PROOF_DIR: ${{ runner.temp }}/gl-tb-vertical-proof
          GL_TB_VERTICAL_BROWSER_DIR: ${{ runner.temp }}/gl-tb-vertical-browser
        run: pnpm test:gl-tb-vertical:browser
      - name: Verify withdrawal-deposit family selection, original upload, worker, sessions and downloads
        env:
          MIZAN_CHROMIUM: /usr/bin/google-chrome
          BANK_WD_BROWSER_DIR: ${{ runner.temp }}/bank-wd-browser
        run: |
          test -x "$MIZAN_CHROMIUM"
          pnpm test:bank-wd:browser
      - name: Verify long assets actual browser lifecycle and independently checked downloads
        env:
          MIZAN_CHROMIUM: /usr/bin/google-chrome
          ASSET_LONG_BROWSER_DIR: ${{ runner.temp }}/fixed-assets-long-browser
        run: |
          test -x "$MIZAN_CHROMIUM"
          pnpm test:fixed-assets-long:browser
      - name: Independently verify human clearing and reopened memberships after UI and session replay
        run: |
          python3 audit/clearing/check_export.py --cleared 7 work/qa/clearing-manual.xlsx
          python3 audit/clearing/check_export.py --cleared 4 work/qa/clearing-reopened.xlsx work/qa/clearing-restored.xlsx
      - name: Independently verify the real OCR browser review record
        run: python3 audit/visual-cell-review/check_record.py work/qa/p6-reviewed.json work/qa/p6-source.png
      - name: Independently verify the manually selected Arabic crop from real browser OCR
        run: python3 audit/visual-numeric/check_record.py work/qa/p6-region-reviewed.json work/qa/p6-region-source.png
      - name: Independently verify native table review, unresolved row and total exclusion
        run: python3 audit/visual-table/check_record.py work/qa/p6-table-reviewed.json work/qa/p6-table-source.png
      - name: Independently verify original image, complete reviewed record and damaged row after UI transfer and replay
        run: |
          python3 audit/visual-accounting/check_record.py work/qa/p6-accounting-source.json work/qa/p6-accounting-source.png
          python3 audit/visual-accounting/check_export.py work/qa/p6-accounting-ar.xlsx work/qa/p6-accounting-en.xlsx work/qa/p6-accounting-restored.xlsx
      - name: Independently verify split-image UI transfer, both languages and replay
        run: |
          python3 audit/visual-split/check_export.py work/qa/p6-split-en-ar.xlsx work/qa/p6-split-en-en.xlsx work/qa/p6-split-en-restored.xlsx work/qa/p6-split-ar-ar.xlsx work/qa/p6-split-ar-en.xlsx work/qa/p6-split-ar-restored.xlsx
      - name: Independently replay local effort timers (accelerated development cases only)
        run: |
          python3 -m unittest discover -s audit/review-effort -p 'test_*.py' -v
          python3 audit/review-effort/check_record.py --development-oracle work/qa/review-effort-ar.json work/qa/review-effort-en.json
      - run: python3 audit/related-invoice/check_export.py work/qa/f03-*.xlsx
      - run: python3 audit/related-invoice/unknown-role/check_export.py work/qa/unknown-*.xlsx
      - run: python3 audit/assistant-evidence/check_export.py work/qa/p5-*.xlsx --browser work/qa/p5-browser.json
      - name: Independently verify layered XLSX headers after browser upload and session replay
        run: python3 audit/layered-statement/check_export.py work/qa/layered-0-direct.xlsx work/qa/layered-0-restored.xlsx work/qa/layered-1-direct.xlsx work/qa/layered-1-restored.xlsx
      - name: Independently verify typed documents and short-reference proofs after native replay
        run: |
          python3 audit/typed-document/check_export.py work/qa/typed-0-direct.xlsx work/qa/typed-0-restored.xlsx work/qa/typed-1-direct.xlsx work/qa/typed-1-restored.xlsx
          python3 -m unittest discover -s audit/typed-document -p 'test_*.py' -v
      - name: Independently verify original bank browser decisions, reversal policy, timing and sessions
        run: |
          python3 audit/bank/check_export.py work/qa/bank-direct.xlsx
          python3 audit/bank/check_export.py work/qa/bank-restored.xlsx
          python3 audit/bank/check_export.py --contract individual work/qa/bank-individual.xlsx
          python3 audit/bank/check_export.py --contract timing-after-cutoff --through 1 work/qa/bank-timing-manual.xlsx
          python3 audit/bank/check_export.py --contract timing-after-cutoff --through 1 work/qa/bank-timing-restored.xlsx
          python3 audit/bank/check_export.py --contract timing-after-cutoff work/qa/bank-timing-undo.xlsx
          python3 audit/bank/check_export.py --contract no-identity --through 1 work/qa/bank-noidentity-manual.xlsx
          python3 audit/bank/check_export.py --contract no-identity work/qa/bank-noidentity-undo.xlsx
          python3 audit/bank/check_export.py --contract balanced-extra-members work/qa/bank-policy-error.xlsx
          python3 audit/bank/check_export.py --contract wrong-fee-parent work/qa/bank-source-error.xlsx
          python3 audit/bank/check_export.py --native-sources work/qa/bank-native-source-0.xlsx work/qa/bank-native-source-1.xlsx work/qa/bank-native.xlsx
          python3 audit/bank/check_export.py --native-sources work/qa/bank-native-source-0.xlsx work/qa/bank-native-source-1.xlsx work/qa/bank-native-restored.xlsx
      - name: Independently verify allocation and GL/TB browser downloads
        run: |
          python3 audit/allocation/check_export.py work/qa/allocation-direct.xlsx work/qa/allocation-restored.xlsx
          python3 audit/allocation/check_export.py --contract undo work/qa/allocation-undo.xlsx
          python3 audit/allocation/check_export.py --contract payment-overrun work/qa/allocation-overrun.xlsx
          python3 audit/allocation/check_export.py --contract currency-mismatch work/qa/allocation-source-error.xlsx
          python3 audit/allocation/check_export.py --native-sources work/qa/allocation-native-source-0.xlsx work/qa/allocation-native-source-1.xlsx work/qa/allocation-native-source-2.xlsx work/qa/allocation-native.xlsx work/qa/allocation-native-restored.xlsx
          python3 audit/gl-tb/check_export.py work/qa/gl-tb-direct.xlsx
          python3 audit/gl-tb/check_export.py --native-sources work/qa/gl-tb-native-gl.xlsx work/qa/gl-tb-native-tb.xlsx work/qa/gl-tb-native.xlsx work/qa/gl-tb-native-restored.xlsx
          python3 audit/gl-tb/check_export.py --contract same-net-different-turnover work/qa/gl-tb-turnover.xlsx
          python3 audit/gl-tb/check_export.py --contract zero-activity work/qa/gl-tb-zero.xlsx
          python3 audit/gl-tb/check_export.py --contract missing-tb work/qa/gl-tb-missing.xlsx
          python3 audit/gl-tb/check_export.py --contract dimensions-mismatch work/qa/gl-tb-scope-error.xlsx
      - name: Independently verify customer AR browser downloads
        run: |
          python3 audit/ar-limited/check_export.py work/qa/ar-direct.xlsx work/qa/ar-reconfirmed.xlsx
          python3 audit/ar-limited/check_export.py --reopened work/qa/ar-reopened.xlsx work/qa/ar-restored.xlsx
          python3 audit/ar-limited/check_export.py --contract amount-difference work/qa/ar-negative.xlsx
      - name: Verify partial results through the Arabic and English interface
        run: |
          node audit/partial-input/browser/run.mjs ci-partial isolated
          python3 audit/partial-reconciliation/check_openxml.py --xlsx audit/partial-input/browser/ci-partial/partial.xlsx --out audit/partial-input/browser/ci-partial/openxml.json --browser-oracle audit/partial-input/browser/fixtures-isolated/oracle.json --require-reviewed --expected-engine 0.3.26-experimental
          node audit/partial-input/browser/run.mjs ci-partial-original original
          python3 audit/partial-reconciliation/check_openxml.py --xlsx audit/partial-input/browser/ci-partial-original/partial.xlsx --out audit/partial-input/browser/ci-partial-original/openxml.json --browser-oracle audit/partial-input/browser/fixtures/oracle.json --require-reviewed --expected-engine 0.3.26-experimental
      - name: Verify large PDFs through the browser and independently check the exported workbook
        run: |
          node audit/large-statements/browser/run.mjs ci-large-native
          python3 audit/large-statements/check_openxml.py --browser-dir audit/large-statements/browser/ci-large-native --out audit/large-statements/browser/ci-large-native/openxml.json --expected-engine 0.3.26-experimental
      - name: Verify complete public source export and distribution before upload
        run: |
          node scripts/public-content-check.mjs --source-export
          node scripts/public-content-check.mjs --dist
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
  mutations:
    name: Accounting mutation gate (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Verify approved public source and privacy guard
        run: |
          node --test scripts/public-content-check.test.mjs
          node scripts/public-content-check.mjs --source
      - run: pnpm install --frozen-lockfile
      - name: Verify regression tests detect deliberate accounting faults
        env:
          MUTATION_SHARD: ${{ matrix.shard }}/6
          MUTATION_TEST_CONCURRENCY: '2'
        run: pnpm test:mutations
  specialized-faults:
    name: Specialized accounting fault gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Verify approved public source and privacy guard
        run: |
          node --test scripts/public-content-check.test.mjs
          node scripts/public-content-check.mjs --source
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutation-runner
      - name: Recompute all36 specialized faults in disposable copies
        env:
          SPECIALIZED_FAULT_OUTPUT_DIR: ${{ runner.temp }}/specialized-fault-evidence
        run: pnpm test:specialized-faults
  bank-statement-interface-mutations:
    name: Bank statement interface mutations in built browser copies (BNK-PDF-1 G5)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Verify approved public source and privacy guard
        run: |
          node --test scripts/public-content-check.test.mjs
          node scripts/public-content-check.mjs --source
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build each planted interface defect and require the browser acceptance to catch it
        env:
          BNK_INTERFACE_MUTATION_DIR: ${{ runner.temp }}/bank-statement-interface-mutations
        run: pnpm test:bank-statement:interface-mutations
  bank-statement-holdout:
    name: Bank statement holdouts from eighteen other PDF producers against their recorded outcomes (BNK-PDF-1 G6, G8, G9, G10, G12, G14, G15, G17, G20)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Verify approved public source and privacy guard
        run: |
          node --test scripts/public-content-check.test.mjs
          node scripts/public-content-check.mjs --source
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Read and match the sealed holdout in Node against its recorded outcome
        env:
          BNK_HOLDOUT_DIR: ${{ runner.temp }}/bank-statement-holdout
        run: pnpm test:bank-statement:g6-holdout
      - name: Read and match the second sealed holdout in Node against its recorded outcome
        env:
          BNK_HOLDOUT_DIR: ${{ runner.temp }}/bank-statement-holdout
        run: pnpm test:bank-statement:g8-holdout
      - name: Read and match the third sealed holdout in Node against its recorded outcome
        env:
          BNK_HOLDOUT_DIR: ${{ runner.temp }}/bank-statement-holdout
        run: pnpm test:bank-statement:g9-holdout
      - name: Read and match the fourth sealed holdout in Node against its recorded outcome
        env:
          BNK_HOLDOUT_DIR: ${{ runner.temp }}/bank-statement-holdout
        run: pnpm test:bank-statement:g10-holdout
      - name: Read and match the fifth sealed holdout in Node against its recorded outcome
        env:
          BNK_HOLDOUT_DIR: ${{ runner.temp }}/bank-statement-holdout
        run: pnpm test:bank-statement:g12-holdout
      - name: Read and match the sixth sealed holdout in Node against its recorded outcome
        env:
          BNK_HOLDOUT_DIR: ${{ runner.temp }}/bank-statement-holdout
        run: pnpm test:bank-statement:g14-holdout
      - name: Read and match the seventh sealed holdout in Node against its recorded outcome
        env:
          BNK_HOLDOUT_DIR: ${{ runner.temp }}/bank-statement-holdout
        run: pnpm test:bank-statement:g15-holdout
      - name: Read and match the eighth sealed holdout in Node against its recorded outcome
        env:
          BNK_HOLDOUT_DIR: ${{ runner.temp }}/bank-statement-holdout
        run: pnpm test:bank-statement:g17-holdout
      - name: Read and match the ninth sealed holdout in Node against its recorded outcome
        env:
          BNK_HOLDOUT_DIR: ${{ runner.temp }}/bank-statement-holdout
        run: pnpm test:bank-statement:g20-holdout
      - name: Read and match the tenth sealed holdout in Node against its recorded outcome
        env:
          BNK_HOLDOUT_DIR: ${{ runner.temp }}/bank-statement-holdout
        run: pnpm test:bank-statement:g23-holdout
      - name: Read and match the sealed supplier statement holdout in Node against its recorded outcome (SUP-2 S3)
        run: pnpm test:supplier-statement:s3-holdout
      - run: pnpm build
      - name: Run the sealed holdout through the built bank workspace against its recorded outcome
        env:
          BNK_HOLDOUT_BROWSER_DIR: ${{ runner.temp }}/bank-statement-holdout-browser
        run: pnpm test:bank-statement:g6-browser
      - name: Run the second sealed holdout through the built bank workspace against its recorded outcome
        env:
          BNK_HOLDOUT_BROWSER_DIR: ${{ runner.temp }}/bank-statement-holdout-browser
        run: pnpm test:bank-statement:g8-browser
      - name: Run the third sealed holdout through the built bank workspace against its recorded outcome
        env:
          BNK_HOLDOUT_BROWSER_DIR: ${{ runner.temp }}/bank-statement-holdout-browser
        run: pnpm test:bank-statement:g9-browser
      - name: Run the fourth sealed holdout through the built bank workspace against its recorded outcome
        env:
          BNK_HOLDOUT_BROWSER_DIR: ${{ runner.temp }}/bank-statement-holdout-browser
        run: pnpm test:bank-statement:g10-browser
      - name: Run the fifth sealed holdout through the built bank workspace against its recorded outcome
        env:
          BNK_HOLDOUT_BROWSER_DIR: ${{ runner.temp }}/bank-statement-holdout-browser
        run: pnpm test:bank-statement:g12-browser
      - name: Run the sixth sealed holdout through the built bank workspace against its recorded outcome
        env:
          BNK_HOLDOUT_BROWSER_DIR: ${{ runner.temp }}/bank-statement-holdout-browser
        run: pnpm test:bank-statement:g14-browser
      - name: Run the seventh sealed holdout through the built bank workspace against its recorded outcome
        env:
          BNK_HOLDOUT_BROWSER_DIR: ${{ runner.temp }}/bank-statement-holdout-browser
        run: pnpm test:bank-statement:g15-browser
      - name: Run the eighth sealed holdout through the built bank workspace against its recorded outcome
        env:
          BNK_HOLDOUT_BROWSER_DIR: ${{ runner.temp }}/bank-statement-holdout-browser
        run: pnpm test:bank-statement:g17-browser
      - name: Run the ninth sealed holdout through the built bank workspace against its recorded outcome
        env:
          BNK_HOLDOUT_BROWSER_DIR: ${{ runner.temp }}/bank-statement-holdout-browser
        run: pnpm test:bank-statement:g20-browser
      - name: Run the tenth sealed holdout through the built bank workspace against its recorded outcome
        env:
          BNK_HOLDOUT_BROWSER_DIR: ${{ runner.temp }}/bank-statement-holdout-browser
        run: pnpm test:bank-statement:g23-browser
  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs:
      - build
      - mutations
      - specialized-faults
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
