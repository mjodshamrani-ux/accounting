allowBuilds:
  esbuild: true
  sharp: false
  tesseract.js: false
  workerd: false

overrides:
  "exceljs>uuid": "11.1.1"
  "brace-expansion@^1.0.0": "1.1.21"
  "brace-expansion@^2.0.0": "2.1.7"
  "brace-expansion@^5.0.0": "5.0.12"
  "fast-uri@^3.0.0": "3.1.8"
  "ip-address@^10.0.0": "10.7.1"

# pnpm audit gates the build at moderate. GHSA-g3hv-75wg-m249 (minimatch
# <11.0.1, 30 October 2026) concerns firstPhasePreProcess with
# optimizationLevel, which the installed minimatch 3 and 5 do not have, and
# the application build carries no minimatch. The owner set it aside on that
# measured premise; tests/dependency-advisories.test.ts checks the premise on
# every run and fails when it no longer holds or when nothing needs the entry.
auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249
